<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YUHUI — Glow in the Dark Powder, Luminous Stones &amp; Photoluminescent Pigment Manufacturer</title>
<meta name="description" content="Shandong Yuhui New Materials Co., Ltd. — factory-direct manufacturer of strontium aluminate glow powder, luminous stones and photoluminescent coatings. Batch tested, worldwide export from China.">
<meta name="keywords" content="glow in the dark powder, luminous stone, photoluminescent pigment, strontium aluminate, glow powder manufacturer China, مسحوق متوهج">
<meta property="og:title" content="YUHUI — Photoluminescent Materials Manufacturer">
<meta property="og:description" content="Factory-direct glow powder, luminous stones and glow coatings from Shandong, China.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://www.yuhuiglow.com/">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --blue:#0b5fff; --deep:#0a2e6e; --navy:#0d1b33; --sky:#e8f1ff;
    --line:#e3e9f2; --txt:#2a3648; --dim:#68778c; --accent:#00b3ff;
    --glow:#00e0a4; --radius:14px;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{font-family:"Inter","Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--txt);background:#fff;line-height:1.65;overflow-x:hidden}
  html[lang="ar"] body{font-family:"Cairo","Segoe UI",Tahoma,sans-serif;line-height:1.8}
  img{max-width:100%;display:block}
  a{text-decoration:none;color:inherit}
  button{font-family:inherit}
  .wrap{max-width:1240px;margin:0 auto;padding:0 4vw}

  .progress{position:fixed;top:0;left:0;height:3px;width:0;background:linear-gradient(90deg,var(--blue),var(--glow));z-index:200;transition:width .1s linear}
  [dir="rtl"] .progress{left:auto;right:0;background:linear-gradient(-90deg,var(--blue),var(--glow))}

  .util{background:var(--navy);color:#b9c8e2;font-size:13px}
  .util .wrap{display:flex;justify-content:space-between;padding:7px 4vw;gap:16px}
  .util a{color:#fff;margin-inline-start:20px;transition:.2s}
  .util a:hover{color:var(--accent)}
  @media(max-width:760px){.util span:first-child{display:none}.util .wrap{justify-content:center}}

  header{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);box-shadow:0 2px 14px rgba(10,30,70,.05)}
  header .wrap{display:flex;align-items:center;justify-content:space-between;padding-top:10px;padding-bottom:10px;gap:20px}
  .brand{display:flex;align-items:center;gap:12px;flex:0 0 auto}
  .brand img{height:56px;border-radius:8px}
  .brand .bt{line-height:1.25}
  .brand .b1{font-size:21px;font-weight:800;color:var(--deep);letter-spacing:1px;display:block}
  .brand .b2{font-size:10.5px;color:var(--dim);letter-spacing:.3px}
  html[lang="ar"] .brand .b1{letter-spacing:0;font-size:20px}
  nav{display:flex;gap:22px;align-items:center;flex:1;justify-content:flex-end}
  nav a{color:var(--txt);font-size:14.5px;font-weight:600;position:relative;padding-bottom:6px;white-space:nowrap}
  nav a.on,nav a:hover{color:var(--blue)}
  nav a::after{content:"";position:absolute;inset-inline-start:0;inset-inline-end:100%;bottom:0;height:2px;background:var(--blue);border-radius:2px;transition:inset-inline-end .25s}
  nav a:hover::after{inset-inline-end:0}
  .quote{background:var(--blue);color:#fff!important;padding:11px 22px;border-radius:8px;font-weight:700;font-size:14px;transition:.25s;display:inline-block}
  .quote:hover{background:var(--deep);transform:translateY(-1px);box-shadow:0 8px 20px rgba(11,95,255,.3)}
  .quote::after{display:none}
  .nav-right{display:flex;align-items:center;gap:14px;flex:0 0 auto}

  .lang-switch{display:inline-flex;background:var(--sky);border:1px solid var(--line);border-radius:8px;padding:3px;gap:2px}
  .lang-switch button{background:none;border:none;padding:6px 12px;border-radius:6px;font-size:13px;font-weight:700;color:var(--dim);transition:.2s}
  .lang-switch button.on{background:var(--blue);color:#fff}
  .lang-switch button:hover:not(.on){color:var(--blue)}

  .burger{display:none;background:none;border:none;font-size:26px;color:var(--deep);cursor:pointer}
  @media(max-width:1040px){
    nav{position:fixed;inset:0 0 0 auto;width:min(78vw,340px);background:#fff;flex-direction:column;align-items:stretch;gap:4px;padding:90px 30px 30px;box-shadow:-10px 0 40px rgba(10,30,70,.15);transform:translateX(105%);transition:transform .35s;justify-content:flex-start;z-index:35}
    [dir="rtl"] nav{inset:0 auto 0 0;box-shadow:10px 0 40px rgba(10,30,70,.15);transform:translateX(-105%)}
    nav.open{transform:none!important}
    nav a{width:100%;padding:12px 0;border-bottom:1px solid var(--line);font-size:16px}
    nav .quote{margin-top:16px;text-align:center;width:100%}
    nav a::after{display:none}
    .burger{display:block;z-index:40}
  }

  .hero{position:relative;height:min(86vh,680px);min-height:520px;overflow:hidden;background:var(--navy)}
  .slide{position:absolute;inset:0;opacity:0;transition:opacity 1.1s ease;display:flex;align-items:center;pointer-events:none}
  .slide.on{opacity:1;z-index:2;pointer-events:auto}
  .slide::before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.14) 1px,transparent 1px);background-size:26px 26px;opacity:.35}
  .s1{background:linear-gradient(105deg,#0a2e6e 0%,#124ab8 55%,#00b3ff 130%)}
  .s2{background:linear-gradient(105deg,#0d1b33 0%,#123a75 60%,#0b5fff 135%)}
  .s3{background:linear-gradient(105deg,#062e22 0%,#0f6a52 60%,#00e0a4 135%)}
  html[lang="ar"] .s1{background:linear-gradient(-105deg,#0a2e6e 0%,#124ab8 55%,#00b3ff 130%)}
  html[lang="ar"] .s2{background:linear-gradient(-105deg,#0d1b33 0%,#123a75 60%,#0b5fff 135%)}
  html[lang="ar"] .s3{background:linear-gradient(-105deg,#062e22 0%,#0f6a52 60%,#00e0a4 135%)}
  .slide .wrap{position:relative;z-index:3;width:100%}
  .kicker{display:inline-block;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.35);color:#fff;font-size:12px;letter-spacing:2px;padding:6px 16px;border-radius:30px;margin-bottom:20px;text-transform:uppercase;backdrop-filter:blur(4px)}
  html[lang="ar"] .kicker{letter-spacing:0;font-size:13px}
  .slide h1{color:#fff;font-size:clamp(28px,4.6vw,54px);line-height:1.15;font-weight:800;max-width:780px;letter-spacing:-.5px}
  html[lang="ar"] .slide h1{letter-spacing:0;line-height:1.35;font-size:clamp(26px,4.2vw,48px)}
  .slide p{color:rgba(255,255,255,.85);font-size:16.5px;max-width:620px;margin:18px 0 32px}
  .hbtns{display:flex;gap:14px;flex-wrap:wrap}
  .h1{background:#fff;color:var(--deep);padding:13px 30px;border-radius:8px;font-weight:700;transition:.25s;display:inline-block}
  .h1:hover{box-shadow:0 12px 28px rgba(0,0,0,.28);transform:translateY(-2px)}
  .h2{border:1.5px solid rgba(255,255,255,.7);color:#fff;padding:13px 30px;border-radius:8px;font-weight:600;transition:.25s;display:inline-block}
  .h2:hover{background:rgba(255,255,255,.14)}
  .glow-art{position:absolute;right:-80px;top:50%;transform:translateY(-50%);width:460px;height:460px;border-radius:50%;background:radial-gradient(circle at 40% 40%,rgba(160,255,200,.55),rgba(0,180,255,.16) 55%,transparent 72%);filter:blur(6px);pointer-events:none;animation:float 8s ease-in-out infinite}
  [dir="rtl"] .glow-art{right:auto;left:-80px}
  @keyframes float{50%{transform:translateY(-56%) scale(1.05)}}
  .dots{position:absolute;bottom:26px;left:50%;transform:translateX(-50%);display:flex;gap:10px;z-index:5}
  .dots i{width:36px;height:4px;border-radius:2px;background:rgba(255,255,255,.35);cursor:pointer;transition:.25s}
  .dots i.on{background:#fff;width:52px}
  .scroll-hint{position:absolute;bottom:24px;right:4vw;z-index:5;color:rgba(255,255,255,.6);font-size:12px;letter-spacing:2px;writing-mode:vertical-rl}
  [dir="rtl"] .scroll-hint{right:auto;left:4vw}
  @media(max-width:640px){.glow-art{width:280px;height:280px;right:-120px}[dir="rtl"] .glow-art{left:-120px;right:auto}.scroll-hint{display:none}}

  .trust{background:var(--sky);border-bottom:1px solid var(--line)}
  .trust .wrap{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;padding:26px 4vw}
  .ti{display:flex;gap:14px;align-items:center}
  .ti .ic{width:46px;height:46px;flex:0 0 46px;border-radius:12px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:22px;box-shadow:0 3px 10px rgba(10,40,90,.08)}
  .ti b{display:block;font-size:15px;color:var(--deep)}
  .ti span{font-size:12.5px;color:var(--dim)}

  section{padding:84px 0}
  .st{text-align:center;margin-bottom:52px}
  .st .lb{color:var(--blue);font-weight:700;letter-spacing:3px;font-size:12.5px;text-transform:uppercase}
  html[lang="ar"] .st .lb{letter-spacing:0}
  .st h2{font-size:clamp(26px,3.6vw,38px);color:var(--navy);margin:8px 0 14px;letter-spacing:-.5px}
  html[lang="ar"] .st h2{letter-spacing:0}
  .st p{color:var(--dim);max-width:680px;margin:0 auto}
  .rule{width:56px;height:4px;background:linear-gradient(90deg,var(--blue),var(--glow));border-radius:2px;margin:16px auto 0}
  html[lang="ar"] .rule{background:linear-gradient(-90deg,var(--blue),var(--glow))}

  .apps{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:18px}
  .app{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:26px 22px;cursor:pointer;transition:.3s;position:relative;overflow:hidden}
  .app::before{content:"";position:absolute;inset:0;background:linear-gradient(135deg,rgba(11,95,255,.06),rgba(0,224,164,.06));opacity:0;transition:.3s}
  .app:hover{transform:translateY(-5px);box-shadow:0 16px 36px -16px rgba(11,60,160,.3);border-color:#c8d8f5}
  .app:hover::before{opacity:1}
  .app .ai{font-size:30px;margin-bottom:12px;display:block;position:relative}
  .app h4{color:var(--navy);font-size:15.5px;margin-bottom:6px;position:relative}
  .app p{font-size:13px;color:var(--dim);position:relative}
  .app.sel{border-color:var(--blue);box-shadow:0 0 0 3px rgba(11,95,255,.12)}

  .filterbar{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-bottom:30px}
  .filterbar button{background:#fff;border:1px solid var(--line);color:var(--dim);padding:8px 18px;border-radius:30px;font-size:13.5px;font-weight:600;cursor:pointer;transition:.25s}
  .filterbar button:hover{border-color:var(--blue);color:var(--blue)}
  .filterbar button.on{background:var(--blue);border-color:var(--blue);color:#fff}

  .pgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:26px}
  .pcard{border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;background:#fff;transition:.35s;display:flex;flex-direction:column}
  .pcard:hover{transform:translateY(-6px);box-shadow:0 22px 46px -18px rgba(11,60,160,.3);border-color:#c8d8f5}
  .pcard.hide{display:none}
  .pimg{height:190px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
  .pimg::after{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.2) 1px,transparent 1px);background-size:18px 18px;opacity:.5}
  .pimg .ph{font-size:52px;filter:drop-shadow(0 6px 16px rgba(0,0,0,.35));position:relative;z-index:2}
  .pimg small{position:absolute;inset-inline-start:14px;top:12px;background:rgba(255,255,255,.92);color:var(--deep);font-size:11px;font-weight:700;letter-spacing:1px;padding:4px 10px;border-radius:5px;z-index:2}
  html[lang="ar"] .pimg small{letter-spacing:0}
  .g1{background:linear-gradient(135deg,#0a2e6e,#00b3ff)}
  .g2{background:linear-gradient(135deg,#0d1b33,#00c48f)}
  .g3{background:linear-gradient(135deg,#33210a,#ffb347)}
  .g4{background:linear-gradient(135deg,#2a0a3d,#b44dff)}
  .pbody{padding:22px;flex:1;display:flex;flex-direction:column}
  .pbody h3{color:var(--navy);font-size:18px;margin-bottom:10px}
  .pbody p{font-size:14px;color:var(--dim);flex:1}
  .spec{margin:14px 0 18px;border-top:1px dashed var(--line);padding-top:12px;font-size:13px}
  .spec div{display:flex;justify-content:space-between;padding:4px 0;color:var(--txt);gap:12px}
  .spec div span:last-child{color:var(--deep);font-weight:600;text-align:end}
  .pactions{display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap}
  .plink{color:var(--blue);font-weight:700;font-size:14px;cursor:pointer;background:none;border:none;padding:0;transition:.2s}
  .plink:hover{color:var(--deep);text-decoration:underline}
  .pquick{color:var(--dim);font-size:13px;font-weight:600;cursor:pointer;background:none;border:none;transition:.2s}
  .pquick:hover{color:var(--blue)}

  .tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius);box-shadow:0 8px 28px -18px rgba(10,40,90,.2)}
  table{width:100%;border-collapse:collapse;min-width:760px;background:#fff;font-size:14.5px}
  th{background:var(--deep);color:#fff;text-align:start;padding:15px 18px;font-weight:600;font-size:13.5px;letter-spacing:.3px}
  td{padding:13px 18px;border-bottom:1px solid var(--line)}
  tr:last-child td{border-bottom:none}
  tr:nth-child(even) td{background:#f7faff}
  td:first-child{font-weight:700;color:var(--navy)}
  .rec{display:inline-block;background:#e6f7ef;color:#0a8a4f;font-size:11.5px;font-weight:700;padding:3px 10px;border-radius:20px}

  .proc{background:var(--sky)}
  .steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:20px}
  .step{background:#fff;border-radius:var(--radius);padding:26px 20px;text-align:center;border:1px solid var(--line);transition:.3s}
  .step:hover{transform:translateY(-4px);box-shadow:0 14px 30px -16px rgba(11,60,160,.25)}
  .step .no{width:42px;height:42px;margin:0 auto 14px;border-radius:50%;background:linear-gradient(135deg,var(--blue),var(--accent));color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:17px}
  .step h4{color:var(--navy);font-size:15.5px;margin-bottom:8px}
  .step p{font-size:13px;color:var(--dim)}

  .about{display:grid;grid-template-columns:1fr 1fr;gap:56px;align-items:center}
  @media(max-width:900px){.about{grid-template-columns:1fr;gap:36px}}
  .about .pic{border-radius:var(--radius);overflow:hidden;background:radial-gradient(circle at 50% 40%,#123a75,#0a1a35);min-height:380px;display:flex;align-items:center;justify-content:center;position:relative}
  .about .pic::after{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.1) 1px,transparent 1px);background-size:22px 22px}
  .about .pic img{width:60%;max-width:260px;border-radius:12px;position:relative;z-index:2;box-shadow:0 20px 50px rgba(0,0,0,.4)}
  .about h2{color:var(--navy);font-size:clamp(24px,3vw,34px);margin:8px 0 18px;letter-spacing:-.5px}
  html[lang="ar"] .about h2{letter-spacing:0}
  .about .lb{color:var(--blue);font-weight:700;letter-spacing:3px;font-size:12.5px;text-transform:uppercase}
  html[lang="ar"] .about .lb{letter-spacing:0}
  .about p{color:var(--dim);margin-bottom:14px;font-size:15px}
  .nums{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:24px 0}
  .nums div{background:var(--sky);border-radius:12px;padding:16px 10px;text-align:center}
  .nums b{display:block;font-size:26px;color:var(--blue);letter-spacing:-.5px}
  .nums span{font-size:11.5px;color:var(--dim);letter-spacing:.5px}
  html[lang="ar"] .nums span{letter-spacing:0}

  .faq{max-width:840px;margin:0 auto}
  details{border:1px solid var(--line);border-radius:12px;margin-bottom:14px;background:#fff;overflow:hidden;transition:.25s}
  details[open]{box-shadow:0 10px 28px -18px rgba(10,40,90,.25);border-color:#c8d8f5}
  summary{cursor:pointer;padding:18px 22px;font-weight:700;color:var(--navy);list-style:none;display:flex;justify-content:space-between;align-items:center;gap:16px;font-size:15.5px}
  summary::-webkit-details-marker{display:none}
  summary::after{content:"+";color:var(--blue);font-size:22px;font-weight:400;transition:.3s;flex:0 0 auto}
  details[open] summary::after{transform:rotate(45deg)}
  details p{padding:0 22px 18px;color:var(--dim);font-size:14.5px}

  .band{background:linear-gradient(100deg,var(--deep),var(--blue));padding:0;position:relative;overflow:hidden}
  html[lang="ar"] .band{background:linear-gradient(-100deg,var(--deep),var(--blue))}
  .band::before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.12) 1px,transparent 1px);background-size:24px 24px}
  .band .wrap{position:relative;display:flex;justify-content:space-between;align-items:center;gap:30px;flex-wrap:wrap;padding:56px 4vw}
  .band h2{color:#fff;font-size:clamp(22px,3vw,32px);letter-spacing:-.5px}
  html[lang="ar"] .band h2{letter-spacing:0}
  .band p{color:rgba(255,255,255,.82);margin-top:8px}
  .band a{background:#fff;color:var(--deep);padding:14px 34px;border-radius:8px;font-weight:800;transition:.25s;display:inline-block}
  .band a:hover{box-shadow:0 12px 30px rgba(0,0,0,.32);transform:translateY(-2px)}

  .cgrid{display:grid;grid-template-columns:.9fr 1.1fr;gap:50px}
  @media(max-width:900px){.cgrid{grid-template-columns:1fr;gap:36px}}
  .citem{display:flex;gap:16px;margin-bottom:26px}
  .citem .ic{width:48px;height:48px;flex:0 0 48px;border-radius:12px;background:var(--sky);display:flex;align-items:center;justify-content:center;font-size:21px}
  .citem h5{color:var(--dim);font-size:11.5px;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:2px}
  html[lang="ar"] .citem h5{letter-spacing:0}
  .citem a,.citem b{color:var(--navy);font-size:16px;font-weight:700;transition:.2s;word-break:break-word}
  .citem a:hover{color:var(--blue)}
  form{background:#f7faff;border:1px solid var(--line);border-radius:var(--radius);padding:32px}
  .frow{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  @media(max-width:600px){.frow{grid-template-columns:1fr}form{padding:24px}}
  form input,form select,form textarea{width:100%;padding:13px 15px;border:1px solid #d4deee;border-radius:8px;font-size:15px;font-family:inherit;background:#fff;color:var(--txt);outline:none;margin-bottom:16px;transition:.2s}
  form input:focus,form textarea:focus,form select:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(11,95,255,.12)}
  form textarea{min-height:110px;resize:vertical}
  form button{width:100%;background:var(--blue);color:#fff;border:none;padding:15px;border-radius:8px;font-size:16px;font-weight:800;cursor:pointer;transition:.25s;letter-spacing:.5px}
  html[lang="ar"] form button{letter-spacing:0}
  form button:hover{background:var(--deep);box-shadow:0 10px 24px rgba(11,95,255,.3)}
  form button:disabled{opacity:.6;cursor:wait}
  .formnote{font-size:12.5px;color:var(--dim);text-align:center;margin-top:12px}
  .formmsg{display:none;padding:12px 16px;border-radius:8px;font-size:14px;margin-bottom:16px}
  .formmsg.ok{display:block;background:#e6f7ef;color:#0a8a4f;border:1px solid #b8e6ce}
  .formmsg.err{display:block;background:#fdecec;color:#c0392b;border:1px solid #f5c6c6}

  footer{background:var(--navy);color:#9fb0c8;padding:60px 0 0}
  .fgrid{display:grid;grid-template-columns:1.4fr 1fr 1fr 1.2fr;gap:36px;padding-bottom:44px}
  @media(max-width:900px){.fgrid{grid-template-columns:1fr 1fr}}
  @media(max-width:560px){.fgrid{grid-template-columns:1fr}}
  footer img{height:52px;border-radius:8px;margin-bottom:14px;background:#fff;padding:5px}
  footer h6{color:#fff;font-size:15px;letter-spacing:1px;margin-bottom:16px}
  html[lang="ar"] footer h6{letter-spacing:0}
  footer p{font-size:13.5px;line-height:1.7}
  footer a{display:block;color:#9fb0c8;font-size:13.5px;margin-bottom:10px;transition:.2s}
  footer a:hover{color:var(--accent)}
  .fbot{border-top:1px solid rgba(255,255,255,.1);text-align:center;padding:20px 4vw;font-size:12.5px;color:#6d7f99;display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px}
  .fbot a{display:inline;color:#6d7f99;margin:0}
  .fbot a:hover{color:var(--accent)}

let LANG = "en";
let DATA = null;
let UI_T = null;
let activeFilter = "all";
const $ = (s,r=document) => r.querySelector(s);
const $$ = (s,r=document) => [...r.querySelectorAll(s)];

function detectLang(){
  const url = new URL(location.href);
  const q = url.searchParams.get("lang");
  if (q === "ar" || q === "en") return q;
  const saved = localStorage.getItem("yuhui_lang");
  if (saved === "ar" || saved === "en") return saved;
  return "en";
}

function applyLang(){
  document.documentElement.lang = LANG;
  document.documentElement.dir = LANG === "ar" ? "rtl" : "ltr";
  $$("#langSwitch button").forEach(b => b.classList.toggle("on", b.dataset.lang === LANG));
  UI_T = UI[LANG];
}

function t(path){
  return path.split(".").reduce((o,k) => o && o[k], UI_T);
}

function fillI18n(){
  $$("[data-i18n]").forEach(el => { el.textContent = t(el.dataset.i18n); });
  $("#scrollHint").textContent = UI_T.scroll;
}

async function loadContent(){
  const fallback = LANG === "ar" ? DEFAULT_AR : DEFAULT_EN;
  try{
    const res = await fetch("/api/content?lang=" + LANG, { headers:{ "Accept":"application/json" } });
    if (!res.ok) throw new Error("no api");
    const live = await res.json();
    if (live && typeof live === "object"){
      DATA = {
        site:         live.site         || fallback.site,
        hero:         live.hero         || fallback.hero,
        applications: live.applications || fallback.applications,
        products:     live.products     || fallback.products,
        specs:        live.specs        || fallback.specs,
        faq:          live.faq          || fallback.faq
      };
      return;
    }
  }catch(e){ /* fall through */ }
  DATA = JSON.parse(JSON.stringify(fallback));
}

function renderHero(){
  const box = $("#heroSlides"), dots = $("#heroDots");
  box.innerHTML = DATA.hero.map((h,i)=>`
    <div class="slide ${h.bg||"s1"} ${i===0?"on":""}">
      <div class="glow-art" style="background:radial-gradient(circle at 40% 40%,${h.glow||"rgba(160,255,200,.5)"},transparent 70%)"></div>
      <div class="wrap">
        <span class="kicker">${h.kicker}</span>
        <h1>${h.title}</h1>
        <p>${h.text}</p>
        <div class="hbtns">
          <a class="h1" href="#products">${UI_T.hero.samples}</a>
          <a class="h2" href="https://wa.me/${DATA.site.phoneRaw}" target="_blank" rel="noopener">${UI_T.hero.wa}</a>
        </div>
      </div>
    </div>`).join("");
  dots.innerHTML = DATA.hero.map((_,i)=>`<i class="${i===0?"on":""}" data-s="${i}"></i>`).join("");
}

function renderTrust(){
  $("#trustStrip").innerHTML = UI_T.trust.map(x=>`
    <div class="ti"><div class="ic">${x.ic}</div><div><b>${x.b}</b><span>${x.s}</span></div></div>`).join("");
}

function renderApplications(){
  $("#appsGrid").innerHTML = DATA.applications.map(a=>`
    <div class="app ${activeFilter===a.id?"sel":""}" data-app="${a.id}">
      <span class="ai">${a.icon}</span>
      <h4>${a.name}</h4>
      <p>${a.desc}</p>
    </div>`).join("");
}

function renderFilterBar(){
  const base = `<button class="${activeFilter==="all"?"on":""}" data-f="all">${UI_T.filterAll}</button>`;
  const apps = DATA.applications.map(a =>
    `<button class="${activeFilter===a.id?"on":""}" data-f="${a.id}">${a.name}</button>`
  ).join("");
  $("#filterBar").innerHTML = base + apps;
}

function renderProducts(){
  $("#productsGrid").innerHTML = DATA.products.map(p=>{
    const shown = (p.specs||[]).slice(0,3).map(s => `<div><span>${s.k}</span><span>${s.v}</span></div>`).join("");
    const match = activeFilter==="all" || (p.apps||[]).includes(activeFilter);
    return `
      <div class="pcard ${match?"":"hide"}" data-id="${p.id}">
        <div class="pimg ${p.grad||"g1"}">
          <span class="ph">${p.icon||"✨"}</span>
          ${p.tag ? `<small>${p.tag}</small>` : ""}
        </div>
        <div class="pbody">
          <h3>${p.name}</h3>
          <p>${p.summary}</p>
          <div class="spec">${shown}</div>
          <div class="pactions">
            <button class="plink" data-open="${p.id}">${UI_T.viewDetails}</button>
            <button class="pquick" data-quote="${p.id}">${UI_T.quickQuote}</button>
          </div>
        </div>
      </div>`;
  }).join("");
}

function renderSpecs(){
  $("#specHead").innerHTML = UI_T.sec.specHead.map(h => `<th>${h}</th>`).join("");
  $("#specBody").innerHTML = DATA.specs.map(s=>`
    <tr>
      <td>${s.grade}</td><td>${s.color}</td><td>${s.mesh}</td><td>${s.glow}</td><td>${s.use}</td>
      <td>${s.badge ? `<span class="rec">${s.badge}</span>` : ""}</td>
    </tr>`).join("");
}

function renderSteps(){
  $("#stepsGrid").innerHTML = UI_T.steps.map((s,i)=>`
    <div class="step rv"><div class="no">${i+1}</div><h4>${s.h}</h4><p>${s.p}</p></div>`).join("");
}

function renderAbout(){
  const s = DATA.site;
  $("#aboutCompany").textContent = s.company;
  $("#aboutP1").textContent = UI_T.sec.aboutP1;
  $("#aboutP2").textContent = UI_T.sec.aboutP2;
  $("#numsGrid").innerHTML = UI_T.nums.map(n=>`<div><b>${n.b}</b><span>${n.s}</span></div>`).join("");
}

function renderFaq(){
  $("#faqList").innerHTML = DATA.faq.map((f,i)=>`
    <details ${i===0?"open":""}>
      <summary>${f.q}</summary>
      <p>${f.a}</p>
    </details>`).join("");
}

function renderSite(){
  const s = DATA.site;
  const wa = "https://wa.me/" + s.phoneRaw;
  $("#utilTag").textContent = s.utilTag;
  $("#utilMail").textContent = "✉ " + s.email;
  $("#utilMail").href = "mailto:" + s.email;
  $("#utilTel").textContent = "☎ " + s.phone;
  $("#utilTel").href = "tel:+" + s.phoneRaw;
  $("#brandSub").textContent = s.company;
  $("#cPhone").textContent = s.phone;
  $("#cPhone").href = wa;
  $("#cMail").textContent = s.email;
  $("#cMail").href = "mailto:" + s.email;
  $("#cLinked").href = s.linkedin;
  $("#cLinked").textContent = UI_T.contact.linkedText;
  $("#cAddr").textContent = s.address;
  $("#fWa").textContent = "WhatsApp: " + s.phone;
  $("#fWa").href = wa;
  $("#fTel").textContent = s.phone;
  $("#fTel").href = "tel:+" + s.phoneRaw;
  $("#fMail").textContent = s.email;
  $("#fMail").href = "mailto:" + s.email;
  $("#waBtn").href = wa;
  $("#dWa").href = wa;
  $("#footAbout").textContent = s.company + " — " + UI_T.footer.about;
  $("#footCopy").textContent = s.company;
  $("#interestSelect").innerHTML = DATA.products.map(p=>`<option>${p.name}</option>`).join("") + `<option>OEM</option>`;
  $("#fName").placeholder = UI_T.form.name;
  $("#fEmail").placeholder = UI_T.form.email;
  $("#fCompany").placeholder = UI_T.form.company;
  $("#fCountry").placeholder = UI_T.form.country;
  $("#fMsg").placeholder = UI_T.form.msg;
  $("#submitBtn").textContent = UI_T.form.submit;
}

function initHero(){
  const slides = $$(".slide"), dots = $$(".dots i");
  if (!slides.length) return;
  let cur = 0, timer;
  const go = (i)=>{
    cur = (i===undefined) ? (cur+1)%slides.length : (i+slides.length)%slides.length;
    slides.forEach((s,k)=>s.classList.toggle("on",k===cur));
    dots.forEach((d,k)=>d.classList.toggle("on",k===cur));
  };
  const start = ()=>{ clearInterval(timer); timer = setInterval(()=>go(),6500); };
  dots.forEach(d=>d.addEventListener("click",()=>{ go(+d.dataset.s); start(); }));
  start();
}

function initDrawer(){
  const drawer = $("#drawer"), overlay = $("#overlay");
  const open = (id)=>{
    const p = DATA.products.find(x=>x.id===id);
    if (!p) return;
    $("#dTag").textContent = p.tag || "";
    $("#dName").textContent = p.name;
    $("#dDesc").textContent = p.summary;
    $("#dSpec").innerHTML = (p.specs||[]).map(s=>`<div><span>${s.k}</span><span>${s.v}</span></div>`).join("");
    $("#dApps").innerHTML = (p.apps||[]).map(aid=>{
      const a = DATA.applications.find(x=>x.id===aid);
      return a ? `<span>${a.name}</span>` : "";
    }).join("");
    $("#dNotes").textContent = p.notes || "";
    $("#dQuote").onclick = ()=>{
      close();
      const sel = $("#interestSelect");
      [...sel.options].forEach(o => { if (o.text === p.name) o.selected = true; });
    };
    drawer.classList.add("on");
    overlay.classList.add("on");
    drawer.setAttribute("aria-hidden","false");
    document.body.style.overflow = "hidden";
  };
  const close = ()=>{
    drawer.classList.remove("on");
    overlay.classList.remove("on");
    drawer.setAttribute("aria-hidden","true");
    document.body.style.overflow = "";
  };
  document.addEventListener("click",(e)=>{
    const openBtn = e.target.closest("[data-open]");
    if (openBtn){ open(openBtn.dataset.open); return; }
    const q = e.target.closest("[data-quote]");
    if (q){
      const p = DATA.products.find(x=>x.id===q.dataset.quote);
      if (p){
        const sel = $("#interestSelect");
        [...sel.options].forEach(o => { if (o.text === p.name) o.selected = true; });
        document.getElementById("contact").scrollIntoView({ behavior:"smooth" });
        setTimeout(()=>$("#fName").focus(), 700);
      }
      return;
    }
    if (e.target.closest("#dClose") || e.target === overlay) close();
  });
  document.addEventListener("keydown",(e)=>{ if (e.key === "Escape") close(); });
}

function initFilters(){
  document.addEventListener("click",(e)=>{
    const app = e.target.closest(".app");
    if (app){
      activeFilter = (activeFilter === app.dataset.app) ? "all" : app.dataset.app;
      renderApplications(); renderFilterBar(); renderProducts();
      document.getElementById("products").scrollIntoView({ behavior:"smooth" });
      return;
    }
    const fb = e.target.closest("#filterBar button");
    if (fb){
      activeFilter = fb.dataset.f;
      renderApplications(); renderFilterBar(); renderProducts();
    }
  });
}

function initNav(){
  const nav = $("#nav"), burger = $("#burger");
  burger.addEventListener("click",()=>{
    const open = nav.classList.toggle("open");
    burger.textContent = open ? "✕" : "☰";
  });
  nav.addEventListener("click",(e)=>{
    if (e.target.tagName === "A" && window.innerWidth <= 1040){
      nav.classList.remove("open"); burger.textContent = "☰";
    }
  });
  const secs = ["top","products","applications","specs","about","faq"];
  const spy = new IntersectionObserver((entries)=>{
    entries.forEach(en=>{
      if (en.isIntersecting){
        const id = en.target.id;
        $$("#nav a").forEach(a => a.classList.toggle("on", a.getAttribute("href") === "#"+id));
      }
    });
  }, { rootMargin:"-40% 0px -55% 0px" });
  secs.forEach(id => { const el = document.getElementById(id); if (el) spy.observe(el); });
}

function initReveal(){
  const io = new IntersectionObserver((entries)=>{
    entries.forEach(en=>{
      if (en.isIntersecting){ en.target.classList.add("on"); io.unobserve(en.target); }
    });
  }, { threshold:.12 });
  $$(".rv").forEach(el => io.observe(el));
}

function initProgress(){
  const bar = $("#progress");
  const upd = ()=>{
    const h = document.documentElement.scrollHeight - window.innerHeight;
    bar.style.width = (h > 0 ? (window.scrollY / h) * 100 : 0) + "%";
  };
  window.addEventListener("scroll", upd, { passive:true });
  window.addEventListener("resize", upd);
  upd();
}

function initForm(){
  const form = $("#inquiryForm"), msg = $("#formMsg"), btn = $("#submitBtn");
  form.addEventListener("submit", async (e)=>{
    e.preventDefault();
    msg.className = "formmsg";
    const payload = {
      name: $("#fName").value.trim(),
      email: $("#fEmail").value.trim(),
      company: $("#fCompany").value.trim(),
      country: $("#fCountry").value.trim(),
      interest: $("#interestSelect").value,
      message: $("#fMsg").value.trim(),
      lang: LANG
    };
    if (!payload.name || !payload.email || !payload.country || !payload.message){
      msg.className = "formmsg err"; msg.textContent = UI_T.form.err; return;
    }
    btn.disabled = true; btn.textContent = UI_T.form.sending;
    try{
      const res = await fetch("/api/inquiry", {
        method:"POST",
        headers:{ "Content-Type":"application/json" },
        body: JSON.stringify(payload)
      });
      if (!res.ok) throw new Error("send failed");
      msg.className = "formmsg ok"; msg.textContent = UI_T.form.ok;
      form.reset();
    }catch(err){
      const body = encodeURIComponent(
        `Name: ${payload.name}\nEmail: ${payload.email}\nCompany: ${payload.company}\nCountry: ${payload.country}\nInterest: ${payload.interest}\n\n${payload.message}`
      );
      window.location.href = `mailto:${DATA.site.email}?subject=Website Inquiry — ${encodeURIComponent(payload.name)}&body=${body}`;
      msg.className = "formmsg ok"; msg.textContent = UI_T.form.fallback;
    }finally{
      btn.disabled = false; btn.textContent = UI_T.form.submit;
    }
  });
}

function initLangSwitch(){
  $("#langSwitch").addEventListener("click", async (e)=>{
    const btn = e.target.closest("button[data-lang]");
    if (!btn || btn.dataset.lang === LANG) return;
    LANG = btn.dataset.lang;
    localStorage.setItem("yuhui_lang", LANG);
    const url = new URL(location.href);
    if (LANG === "en") url.searchParams.delete("lang");
    else url.searchParams.set("lang", LANG);
    history.replaceState(null, "", url.toString());
    await boot();
  });
}

async function boot(){
  LANG = detectLang();
  applyLang();
  fillI18n();
  await loadContent();
  renderSite();
  renderHero();
  renderTrust();
  renderApplications();
  renderFilterBar();
  renderProducts();
  renderSpecs();
  renderSteps();
  renderAbout();
  renderFaq();
  initHero();
}

(async function main(){
  $("#yr").textContent = new Date().getFullYear();
  await boot();
  initDrawer();
  initFilters();
  initNav();
  initReveal();
  initProgress();
  initForm();
  initLangSwitch();
})();
</script>
